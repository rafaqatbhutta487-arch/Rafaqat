name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # --- YE NAYA STEP ADD KARO - PROJECT DHUNDNE KE LIYE ---
      - name: Find Flutter Project Path
        id: find-project
        run: |
          PROJECT_PATH=$(find. -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          echo "Flutter project found at: $PROJECT_PATH"
          echo "project_path=$PROJECT_PATH" >> $GITHUB_OUTPUT

      - name: Flutter Doctor
        run: flutter doctor

      - name: Clean and Get Dependencies
        working-directory: ${{ steps.find-project.outputs.project_path }}
        run: |
          flutter clean
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find-project.outputs.project_path }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: release-apk
          path: ${{ steps.find-project.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
