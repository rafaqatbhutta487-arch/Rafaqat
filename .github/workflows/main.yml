name: CineNova Auto Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Auto Fix Project
        shell: bash
        run: |
          set -e

          ROOT="$PROJECT_DIR"
          APP="$PROJECT_DIR/app"

          echo "Starting automatic fixes..."

          # AGP 9 built-in Kotlin fix
          if [ -f "$ROOT/build.gradle.kts" ]; then
            sed -i '/org.jetbrains.kotlin.android.*apply false/d' \
              "$ROOT/build.gradle.kts"
          fi

          if [ -f "$ROOT/build.gradle" ]; then
            sed -i '/org.jetbrains.kotlin.android.*apply false/d' \
              "$ROOT/build.gradle"
          fi

          if [ -f "$APP/build.gradle.kts" ]; then
            sed -i '/id("org.jetbrains.kotlin.android")/d' \
              "$APP/build.gradle.kts"

            sed -i '/jvmTarget = "17"/d' \
              "$APP/build.gradle.kts"
          fi

          # Remove old kotlinOptions block safely
          python3 - "$APP/build.gradle.kts" <<'PY'
import sys
from pathlib import Path

p = Path(sys.argv[1])

if not p.exists():
    sys.exit(0)

s = p.read_text()

while "kotlinOptions {" in s:
    start = s.find("kotlinOptions {")
    brace = s.find("{", start)

    if brace == -1:
        break

    depth = 0
    end = None

    for i in range(brace, len(s)):
        if s[i] == "{":
            depth += 1
        elif s[i] == "}":
            depth -= 1
            if depth == 0:
                end = i + 1
                break

    if end is None:
        break

    s = s[:start] + s[end:]

p.write_text(s)
PY

          # MainActivity comment callback fix
          MAIN_FILE=$(find "$APP/src/main/java" \
            -name "MainActivity.kt" \
            | head -n 1)

          if [ -n "$MAIN_FILE" ]; then

            python3 - "$MAIN_FILE" <<'PY'
import sys
import re
from pathlib import Path

p = Path(sys.argv[1])
s = p.read_text()

# Fix common form:
# vm.comment(video.id, commentText)
# comments = vm.loadComments(video.id)

pattern = r'vm\.comment\(video\.id,\s*commentText\)\s*\n(\s*)comments\s*=\s*vm\.loadComments\(video\.id\)'

replacement = (
    r'vm.comment(video.id, commentText) {\n'
    r'\1    comments = vm.loadComments(video.id)\n'
    r'\1}'
)

new_s, count = re.subn(pattern, replacement, s, count=1)

if count:
    p.write_text(new_s)
    print("Comment callback auto-fixed.")
else:
    print("Comment callback pattern not found; continuing.")
PY

          fi

          chmod +x "$ROOT/gradlew"

          echo "Automatic fixes completed."

      - name: Check Java
        shell: bash
        run: |
          java -version

      - name: Check Gradle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Gradle Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK_FILE" apk-output/CineNova.apk

          echo "APK:"
          echo "$APK_FILE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: apk-output/CineNova.apk
          if-no-files-found: error
