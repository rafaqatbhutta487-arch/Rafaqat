name: CineNova Auto Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using $ZIP"

      - name: Extract ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          FILE=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Auto Fix Kotlin
        run: |
          ROOT="$PROJECT_DIR"
          APP="$PROJECT_DIR/app"

          if [ -f "$ROOT/build.gradle.kts" ]; then
            sed -i '/org.jetbrains.kotlin.android.*apply false/d' "$ROOT/build.gradle.kts"
          fi

          if [ -f "$APP/build.gradle.kts" ]; then
            sed -i '/org.jetbrains.kotlin.android/d' "$APP/build.gradle.kts"
            sed -i '/kotlinOptions {/d' "$APP/build.gradle.kts"
            sed -i '/jvmTarget = "17"/d' "$APP/build.gradle.kts"
          fi

          chmod +x "$ROOT/gradlew"

          echo "Kotlin auto-fix completed"

      - name: Gradle Clean
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --no-daemon --stacktrace

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          mkdir -p apk
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK was not created"
            exit 1
          fi
          cp "$APK" apk/CineNova.apk
          echo "APK found: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: apk/CineNova.apk
