name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find and Extract ZIP
        shell: bash
        run: |
          set -x
          ls -R | head -n 100
          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)
          echo "ZIP FOUND: $ZIP_FILE"
          if [ -z "$ZIP_FILE" ]; then exit 1; fi
          unzip -o "$ZIP_FILE" -d ./project_extract
          ls -R ./project_extract | head -n 200
          PUB=$(find ./project_extract -name "pubspec.yaml" | head -n 1)
          echo "PUBSPEC at $PUB"
          echo "PUB_DIR=$(dirname $PUB)" >> $GITHUB_ENV
      - name: FIX Google ID Token Error
        run: |
          echo "Fixing in $PUB_DIR"
          FILES=$(grep -r "GoogleSignIn" --include="*.dart" -l $PUB_DIR || true)
          for FILE in $FILES; do
            echo "Patching $FILE"
            sed -i 's/GoogleSignIn(/GoogleSignIn(\n      serverClientId: "979337680767-k8vr6hatd2d7pu4e14182lptrou1jo4a.apps.googleusercontent.com",/g' "$FILE"
          done
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Get Dependencies
        working-directory: ${{ env.PUB_DIR }}
        run: |
          pwd
          ls -la
          flutter clean || true
          flutter pub get
      - name: Build APK
        working-directory: ${{ env.PUB_DIR }}
        run: flutter build apk --release --no-tree-shake-icons
      - name: Upload APK v4
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.PUB_DIR }}/build/app/outputs/flutter-apk/app-release.apk
