name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show files and find project
        id: find
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== FINDING PUBSPEC ==="
          find . -name "pubspec.yaml" -type f
          PROJECT=$(find . -name "pubspec.yaml" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT" ]; then
            echo "No pubspec found, using ."
            PROJECT="."
          fi
          echo "Project path is: $PROJECT"
          echo "project_path=$PROJECT" >> $GITHUB_OUTPUT
          echo "=== PUBSPEC CONTENT ==="
          cat "$PROJECT/pubspec.yaml" | head -n 100

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:
          cache-path: ${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:

      - name: Flutter Doctor
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          flutter doctor -v
          flutter --version

      - name: Auto Fix - Clean Project
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          echo "Cleaning..."
          flutter clean || true
          rm -rf .dart_tool || true
          rm -rf build || true
          rm -rf pubspec.lock || true
          flutter pub cache clean --force || true
          echo "Clean done"

      - name: Get dependencies with Retry Loop
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          echo "Trying to get dependencies..."
          for i in 1 2 3 4 5; do
            echo "Attempt $i / 5"
            if flutter pub get; then
              echo "pub get SUCCESS on attempt $i"
              break
            else
              echo "pub get FAILED on attempt $i, retrying..."
              sleep 5
              flutter pub cache repair || true
              rm -rf pubspec.lock || true
            fi
            if [ $i -eq 5 ]; then
              echo "All retries failed, trying flutter pub get --no-precompile"
              flutter pub get --no-precompile || true
            fi
          done

      - name: Check Android Folder
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          ls -la android/ || echo "No android folder"
          ls -la android/app/ || true

      - name: Build APK - Release with Auto Repair
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          echo "Starting Build..."
          # First try normal build
          if flutter build apk --release --no-tree-shake-icons -v; then
            echo "Build Success!"
          else
            echo "First build failed, trying with debug keystore fix..."
            # Fix keystore issue
            cd android
            ./gradlew clean || true
            cd ..
            # Second try
            flutter build apk --release --no-tree-shake-icons --no-shrink -v || flutter build apk --debug -v
          fi
          echo "=== BUILD OUTPUT ==="
          ls -lh build/app/outputs/flutter-apk/ || true
          find build -name "*.apk" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: |
            ${{ steps.find.outputs.project_path }}/build/app/outputs/flutter-apk/*.apk
            ${{ steps.find.outputs.project_path }}/build/app/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            ${{ steps.find.outputs.project_path }}/build/
            /home/runner/.pub-cache/log/
          if-no-files-found: ignore
