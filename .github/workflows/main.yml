name: CineNova Production APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cinenova-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Searching for Android project..."

          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No gradlew and no project ZIP found."
            exit 1
          fi

          echo "Found project ZIP: $ZIP"

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP" -d build-src

          GRADLEW="$(find build-src -type f -name gradlew | head -n 1 || true)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the ZIP."
            echo "ZIP contents:"
            find build-src -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validate Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          test -f gradlew || {
            echo "ERROR: gradlew missing."
            exit 1
          }

          test -f settings.gradle.kts || test -f settings.gradle || {
            echo "ERROR: settings.gradle(.kts) missing."
            exit 1
          }

          test -f build.gradle.kts || test -f build.gradle || {
            echo "ERROR: root build.gradle(.kts) missing."
            exit 1
          }

          test -d app || {
            echo "ERROR: app directory missing."
            exit 1
          }

          test -f app/build.gradle.kts || test -f app/build.gradle || {
            echo "ERROR: app/build.gradle(.kts) missing."
            exit 1
          }

          test -f app/src/main/AndroidManifest.xml || {
            echo "ERROR: AndroidManifest.xml missing."
            exit 1
          }

          chmod +x gradlew

          echo "Android project validation passed."

      - name: Check Firebase configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -f app/google-services.json ]; then
            echo "Firebase configuration found."
          else
            echo "WARNING: app/google-services.json not found."
            echo "Continuing because Supabase can be used without Firebase configuration."
          fi

      - name: Validate package and namespace
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "Checking for CineNova package..."

          grep -R 'com.cinenova.shortvideo' \
            app/src/main \
            app/build.gradle.kts \
            app/build.gradle \
            2>/dev/null || true

      - name: Gradle clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew clean --no-daemon --stacktrace

      - name: Gradle assembleDebug
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching all APK files:"
            find "$PROJECT_DIR" -type f -name '*.apk' -print || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

          mkdir -p apk-output
          cp "$APK" apk-output/CineNova-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: apk-output/CineNova-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build completed
        if: success()
        run: |
          echo "======================================"
          echo "CineNova APK BUILD SUCCESSFUL"
          echo "Download artifact: CineNova-APK"
          echo "======================================"
