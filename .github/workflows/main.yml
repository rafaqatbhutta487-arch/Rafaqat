name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Flutter Project
        id: find
        run: |
          echo "Finding pubspec.yaml..."
          ls -la
          find . -name "pubspec.yaml" -type f
          PROJECT=$(find . -name "pubspec.yaml" -type f -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT" ]; then PROJECT="."; fi
          echo "Project path: $PROJECT"
          echo "project_path=$PROJECT" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Flutter Doctor
        working-directory: ${{ steps.find.outputs.project_path }}
        run: flutter doctor -v

      - name: Clean and Get Dependencies
        working-directory: ${{ steps.find.outputs.project_path }}
        run: |
          flutter clean || true
          rm -rf pubspec.lock || true
          for i in 1 2 3; do
            echo "Attempt $i"
            flutter pub get && break || sleep 5
          done

      - name: Build APK
        working-directory: ${{ steps.find.outputs.project_path }}
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
