name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Find Flutter project
        id: find
        run: |
          PROJECT=$(find . -name "pubspec.yaml" -printf "%h\n" | head -n 1)
          echo "Found project at: $PROJECT"
          echo "project_path=$PROJECT" >> $GITHUB_OUTPUT

      - name: Get dependencies
        working-directory: ${{ steps.find.outputs.project_path }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.find.outputs.project_path }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.find.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
