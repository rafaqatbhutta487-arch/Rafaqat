name: CineNova Auto-Fix APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cinenova-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ---------------------------------------------------------
      # 1. Download repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 21
      # ---------------------------------------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # ---------------------------------------------------------
      # 3. Find CineNova ZIP
      # ---------------------------------------------------------
      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "ZIP files in repository:"
          find . -maxdepth 2 -type f -iname "*.zip" -print

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -iname "*Complete.zip" \
            | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 4. Extract project
      # ---------------------------------------------------------
      - name: Extract CineNova project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/build-project"
          mkdir -p "$GITHUB_WORKSPACE/build-project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/build-project"

          echo "Extracted files:"
          find "$GITHUB_WORKSPACE/build-project" -maxdepth 3 -type f \
            | head -n 100

      # ---------------------------------------------------------
      # 5. Locate actual Gradle project
      # ---------------------------------------------------------
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/build-project" \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
            | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ---------------------------------------------------------
      # 6. Auto-fix AGP 9 built-in Kotlin
      # ---------------------------------------------------------
      - name: Auto-fix AGP 9 Kotlin configuration
        shell: bash
        run: |
          set -e

          ROOT="$PROJECT_DIR"
          APP="$PROJECT_DIR/app"

          echo "Applying AGP 9 Kotlin compatibility fixes..."

          # Remove old Kotlin Android plugin from root build file
          if [ -f "$ROOT/build.gradle.kts" ]; then
            sed -i \
              '/id("org\.jetbrains\.kotlin\.android").*apply false/d' \
              "$ROOT/build.gradle.kts"
          fi

          if [ -f "$ROOT/build.gradle" ]; then
            sed -i \
              "/id[[:space:]]*['\"]org\.jetbrains\.kotlin\.android['\"].*apply false/d" \
              "$ROOT/build.gradle"
          fi

          # Remove old Kotlin Android plugin from app module
          if [ -f "$APP/build.gradle.kts" ]; then
            sed -i \
              '/id("org\.jetbrains\.kotlin\.android")/d' \
              "$APP/build.gradle.kts"

            # Remove legacy kotlinOptions block if present
            python3 - "$APP/build.gradle.kts" <<'PY'
import sys
from pathlib import Path

p = Path(sys.argv[1])
s = p.read_text()

while "kotlinOptions {" in s:
    start = s.find("kotlinOptions {")
    brace = s.find("{", start)

    depth = 0
    end = None

    for i in range(brace, len(s)):
        if s[i] == "{":
            depth += 1
        elif s[i] == "}":
            depth -= 1
            if depth == 0:
                end = i + 1
                break

    if end is None:
        break

    s = s[:start] + s[end:]

p.write_text(s)
PY
          fi

          # Remove Kotlin Android plugin from Groovy app build
          if [ -f "$APP/build.gradle" ]; then
            sed -i \
              "/id[[:space:]]*['\"]org\.jetbrains\.kotlin\.android['\"]/d" \
              "$APP/build.gradle"
          fi

          # Make Gradle wrapper executable
          if [ -f "$ROOT/gradlew" ]; then
            chmod +x "$ROOT/gradlew"
          fi

          echo "AGP 9 Kotlin auto-fix completed."

      # ---------------------------------------------------------
      # 7. Force safe Gradle/JVM settings
      # ---------------------------------------------------------
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          ROOT="$PROJECT_DIR"

          touch "$ROOT/gradle.properties"

          if ! grep -q "^org.gradle.jvmargs=" "$ROOT/gradle.properties"; then
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" \
              >> "$ROOT/gradle.properties"
          fi

          if ! grep -q "^android.useAndroidX=" "$ROOT/gradle.properties"; then
            echo "android.useAndroidX=true" \
              >> "$ROOT/gradle.properties"
          fi

          if ! grep -q "^android.nonTransitiveRClass=" "$ROOT/gradle.properties"; then
            echo "android.nonTransitiveRClass=false" \
              >> "$ROOT/gradle.properties"
          fi

          # Never opt out of built-in Kotlin on AGP 9+
          sed -i '/^android\.builtInKotlin=false/d' \
            "$ROOT/gradle.properties"

          echo "Gradle properties:"
          cat "$ROOT/gradle.properties"

      # ---------------------------------------------------------
      # 8. Show versions
      # ---------------------------------------------------------
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          echo "JAVA:"
          java -version

          echo ""
          echo "GRADLE:"
          "$PROJECT_DIR/gradlew" --version

      # ---------------------------------------------------------
      # 9. Clean
      # ---------------------------------------------------------
      - name: Gradle clean
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ---------------------------------------------------------
      # 10. Build Debug APK
      # ---------------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            --build-cache

      # ---------------------------------------------------------
      # 11. Find APK
      # ---------------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/CineNova-debug.apk"

      # ---------------------------------------------------------
      # 12. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: apk-output/CineNova-debug.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 13. Build summary
      # ---------------------------------------------------------
      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo "======================================"
          echo "CineNova APK BUILD SUCCESSFUL"
          echo "======================================"
          echo "APK artifact: CineNova-APK"
