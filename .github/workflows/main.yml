name: CineNova Real APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cinenova-real-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate CineNova ZIP
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1 || true)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: CineNova ZIP not found."
            exit 1
          fi
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using: $ZIP"

      - name: Extract CineNova project
        shell: bash
        run: |
          set -e
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$SOURCE_ZIP" -d build-src

          # Normalize ZIPs that contain one extra top-level folder.
          if [ ! -f build-src/gradlew ]; then
            GRADLEW="$(find build-src -maxdepth 5 -type f -name gradlew | head -n 1 || true)"
            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR="$(dirname "$GRADLEW")"
              mkdir -p normalized
              cp -a "$PROJECT_DIR"/. normalized/
              rm -rf build-src
              mv normalized build-src
            fi
          fi

          test -f build-src/gradlew || {
            echo "ERROR: Android Gradle wrapper (gradlew) not found inside ZIP."
            find build-src -maxdepth 6 -type f | head -n 200
            exit 1
          }

          chmod +x build-src/gradlew

      - name: Validate Android project
        working-directory: build-src
        shell: bash
        run: |
          set -e
          test -f gradlew
          test -f settings.gradle.kts || test -f settings.gradle
          test -f build.gradle.kts || test -f build.gradle
          test -d app
          echo "Android project structure OK."

      - name: Verify Firebase configuration
        working-directory: build-src
        shell: bash
        run: |
          if [ -f app/google-services.json ] || [ -f google-services.json ]; then
            echo "Firebase configuration found."
          else
            echo "WARNING: google-services.json not found."
            echo "The APK may build, but Firebase/Google Sign-In may not work."
          fi

      - name: Clean project
        working-directory: build-src
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        working-directory: build-src
        shell: bash
        run: |
          set -e
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -e
          APK="$(find build-src -type f -name '*.apk' | head -n 1 || true)"
          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi
          echo "APK generated successfully:"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-Real-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: success()
        run: |
          echo "CineNova APK build completed successfully."
          echo "Go to Actions -> this run -> Artifacts -> CineNova-Real-APK"
