name: CineNova Auto Fix APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build CineNova APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -name "*.zip" \
            ! -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf "$GITHUB_WORKSPACE/project"
          mkdir -p "$GITHUB_WORKSPACE/project"

          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/project"

          echo "ZIP extracted successfully."

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -type f \( \
              -name "settings.gradle.kts" \
              -o \
              -name "settings.gradle" \
            \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Auto fix AGP 9 Kotlin
        shell: bash
        run: |
          set -e

          ROOT="$PROJECT_DIR"
          APP="$PROJECT_DIR/app"

          echo "Applying Kotlin compatibility fixes..."

          if [ -f "$ROOT/build.gradle.kts" ]; then
            sed -i '/org.jetbrains.kotlin.android.*apply false/d' \
              "$ROOT/build.gradle.kts"
          fi

          if [ -f "$ROOT/build.gradle" ]; then
            sed -i '/org.jetbrains.kotlin.android.*apply false/d' \
              "$ROOT/build.gradle"
          fi

          if [ -f "$APP/build.gradle.kts" ]; then
            sed -i '/id("org.jetbrains.kotlin.android")/d' \
              "$APP/build.gradle.kts"

            sed -i '/kotlinOptions {/d' \
              "$APP/build.gradle.kts"

            sed -i '/jvmTarget = "17"/d' \
              "$APP/build.gradle.kts"
          fi

          if [ -f "$APP/build.gradle" ]; then
            sed -i '/org.jetbrains.kotlin.android/d' \
              "$APP/build.gradle"

            sed -i '/jvmTarget = "17"/d' \
              "$APP/build.gradle"
          fi

          chmod +x "$ROOT/gradlew"

          echo "Auto-fix completed."

      - name: Show Java version
        shell: bash
        run: |
          java -version

      - name: Show Gradle version
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Gradle clean
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew clean \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK_FILE"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK_FILE" \
            "$GITHUB_WORKSPACE/apk-output/CineNova.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CineNova-APK
          path: apk-output/CineNova.apk
          if-no-files-found: error

      - name: Build successful
        shell: bash
        run: |
          echo "================================"
          echo "CineNova APK BUILD SUCCESSFUL"
          echo "================================"
